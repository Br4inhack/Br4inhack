<svg xmlns="http://www.w3.org/2000/svg" width="340" height="112" viewBox="0 0 340 112" role="img" aria-label="Say hello">
<style>@keyframes dash{to{stroke-dashoffset:-22}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}@keyframes blink{50%{opacity:0}}@keyframes rise{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes unspin{to{transform:rotate(-360deg)}}.flow{fill:none;stroke-dasharray:6 5;animation:dash 1s linear infinite}.pulse{animation:pulse 1.8s ease-in-out infinite}.blink{animation:blink 1s steps(1) infinite}@keyframes sweep{0%,25%{transform:translateX(-140px) skewX(-20deg)}70%,100%{transform:translateX(420px) skewX(-20deg)}}@keyframes glw{0%,100%{opacity:.3}50%{opacity:.85}}@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}.sw{animation:sweep 3.6s ease-in-out 0.0s infinite}.gl{animation:glw 2.8s ease-in-out 0.0s infinite}.ar{animation:nudge 1.6s ease-in-out infinite}.rg{transform-box:fill-box;transform-origin:center;animation:ring 2.2s ease-out 0.0s infinite}</style>
